<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>NearBai — Boarding House Manager</title>
    <meta name="title" content="NearBai — Boarding House Manager" />
    <meta
      name="description"
      content="NearBai is a local boarding house management platform for rooms, tenants, rent payments, utility charges, and analytics. Built for Philippine properties."
    />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#8b5cf6" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NearBai — Boarding House Manager" />
    <meta property="og:description" content="Manage rooms, tenants, rent payments, and expenses — all in one mobile-friendly platform." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NearBai — Boarding House Manager" />
    <meta name="twitter:description" content="Manage rooms, tenants, rent payments, and expenses — all in one mobile-friendly platform." />

    <!-- 
      =============================================
      FAVICON SETUP
      Uses your custom favicon.ico from the public folder.
      The ?v=2 is a cache-buster to force browsers to load the new file.
      =============================================
    -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.ico?v=2" />

    <!-- Fonts — Inter for a clean modern look -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
